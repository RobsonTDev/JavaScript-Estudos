<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Calculadora Multiplicação</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Calculadora Multiplicação</h1>

            <p>Insira dois números para multiplicar:</p>

            <label for="num1">Primeiro Número:</label>

            <input type="number" id="num1">

            <label for="num2">Segundo Número:</label>

            <input type="number" id="num2">

            <label for="resul">Resultado:</label>

            <input type="text" id="resul" readonly>


            <button onclick="botao_click()">Multiplicar</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let num1 = Number(document.getElementById("num1").value);

            let num2 = Number(document.getElementById("num2").value);

            let resultado = num1 * num2;

            document.getElementById("resul").value = resultado;

        }

    </script>

</body>
</html>
