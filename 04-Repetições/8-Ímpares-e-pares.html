<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Ímpares e Pares</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    
    <style>


        /* ===== Cabeçalho com escudo ===== */
        .cabecalho {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* ===== Escudo do São Paulo ===== */
        .escudo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(215, 25, 32, 0.4));
        }

        /* Ajuste da assinatura */
        #assinatura {
            margin-bottom: 0;
        }

        /* ===== Reset geral ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== Fundo da página ===== */
        body {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f5f5f5;
            background: radial-gradient( circle at top, rgba(180, 0, 35, 0.20), transparent 45% ), linear-gradient( 135deg, #080808, #171717 50%, #090909 );
        }

        /* ===== Área principal ===== */
        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        /* ===== Painel do projeto ===== */
        .box {
            width: 100%;
            padding: 35px;
            background: #151515;
            border: 1px solid #333;
            border-top: 5px solid #d71920;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.55), 0 0 25px rgba(215, 25, 32, 0.08);
        }

        /* ===== Assinatura ===== */
        #assinatura {
            display: inline-block;
            margin-bottom: 25px;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 2px 2px 0 #d71920, 4px 4px 0 #333;
        }

        /* ===== Título ===== */
        h1 {
            margin-bottom: 18px;
            font-size: clamp(22px, 3vw, 30px);
            line-height: 1.3;
            color: #ffffff;
        }

        /* ===== Descrição ===== */
        .box > p {
            margin-bottom: 22px;
            color: #c5c5c5;
            font-size: 15px;
            line-height: 1.7;
        }

        /* ===== Labels ===== */
        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: 700;
            color: #eeeeee;
        }

        /* ===== Campos ===== */
        input {
            display: block;
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 12px;
            background: #090909;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.25s ease;
        }

            input:focus {
                border-color: #d71920;
                box-shadow: 0 0 0 3px rgba(215, 25, 32, 0.15);
            }

        /* ===== Blocos de resultado ===== */
        #resultadoImpares,
        #resultadoPares,
        #resultadoPrimos {
            padding: 16px;
            margin: 15px 0;
            background: #0c0c0c;
            border: 1px solid #303030;
            border-left: 4px solid #d71920;
            border-radius: 8px;
            color: #eeeeee;
            font-size: 14px;
            line-height: 1.8;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        /* Resultado dos pares */
        #resultadoPares {
            border-left-color: #ffffff;
        }

        /* Resultado dos primos */
        #resultadoPrimos {
            border-left-color: #777777;
        }

        /* ===== Botões ===== */
        button {
            display: block;
            width: 100%;
            padding: 14px 18px;
            margin: 18px 0 25px;
            background: linear-gradient( 90deg, #b80018, #e21b2d );
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 5px 0 #70000d, 0 8px 18px rgba(215, 25, 32, 0.15);
            transition: 0.2s ease;
        }

            button:hover {
                filter: brightness(1.15);
                transform: translateY(-2px);
                box-shadow: 0 7px 0 #70000d, 0 10px 25px rgba(215, 25, 32, 0.25);
            }

            button:active {
                transform: translateY(3px);
                box-shadow: 0 2px 0 #70000d;
            }

        /* ===== Responsividade para celulares ===== */
        @media (max-width: 600px) {

            
            .escudo {
                    width: 40px;
                    height: 40px;
            }

            .cabecalho {
                    gap: 12px;
            }
            

            body {
                padding: 18px 12px;
            }

            .container {
                max-width: 100%;
            }

            .box {
                padding: 24px 18px;
                border-radius: 12px;
            }

            #assinatura {
                font-size: 23px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .box > p {
                font-size: 14px;
            }

            label {
                font-size: 13px;
            }

            input {
                padding: 13px;
                font-size: 16px;
            }

            button {
                padding: 14px;
                font-size: 14px;
            }

            #resultadoImpares,
            #resultadoPares,
            #resultadoPrimos {
                padding: 13px;
                font-size: 13px;
            }
        }

        /* ===== Telas muito pequenas ===== */
        @media (max-width: 360px) {
            body {
                padding: 12px 8px;
            }

            .box {
                padding: 20px 14px;
            }

            h1 {
                font-size: 20px;
            }

            #assinatura {
                font-size: 21px;
            }
        }




    </style>
</head>
<body>
    <div class="container">
        <div class="box">


            <div class="cabecalho">
                <img src="escudo-teste.png" width="100" alt="Escudo teste">




                <span id="assinatura">RobsonT.Dev</span>
            </div>


            <h1>Descubra os Números Ímpares, Pares e Primos:</h1>

            <p>
                Digite dois números para descobrir os ímpares e pares e a soma deles,
                no Terceiro campo Digite um número para Descobrir os Primos:
            </p>

            <label for="inicial">Número Inicial Para Descobrir Ímpares e Pares:</label>
            <input type="number" id="inicial">

            <label for="final">Número Final Para Descobrir Ímpares e Pares:</label>
            <input type="number" id="final">

            <p id="resultadoImpares">Números Ímpares:</p>

            <p id="resultadoPares">Números Pares:</p>

            <button onclick="botao_click()">Descobrir Pares e Ímpares</button>

            <label for="finalPrimo">Digite um número para descobrir os primos até ele:</label>
            <input type="number" id="finalPrimo">

            <p id="resultadoPrimos">Números Primos:</p>

            <button onclick="botao_primos()">Números Primos</button>


        </div>
    </div>

    <script>

        function botao_click() {

            let inicial = parseInt(document.getElementById("inicial").value);

            let final = parseInt(document.getElementById("final").value);

            let somaImpares = 0;

            let somaPares = 0;

            let numerosImpares = [];

            let numerosPares = [];

            if (inicial >= final) { 
                alert("O número inicial dever ser menor que o número final.");
                return;
            }

            for (let i = inicial; i <= final; i++) { 

                let resto = i % 2;

                // Se o resto da divisão for diferente de zero, significa que o número é ímpar
                if (resto !== 0) {
                    somaImpares += i;
                    numerosImpares.push(i);
                }
                // Se o resto da divisão for igual a zero, significa que o número é par
                else { 
                    somaPares += i;
                    numerosPares.push(i);
                }
            }
            document.getElementById("resultadoImpares").innerHTML = "Os números ímpares entre " + inicial + 
                " e " + final + " são: " + numerosImpares.join(", ") + " .<br>A soma dos números ímpares: " + somaImpares; 

            document.getElementById("resultadoPares").innerHTML = "Os números pares entre " + inicial +
                " e " + final + " são: " + numerosPares.join(", ") + " .<br>A soma dos números pares: " + somaPares;
        }
        function botao_primos() {

            let finalPrimo = parseInt(document.getElementById("finalPrimo").value);

            let primos = [];

            for (let i = 2; i <= finalPrimo; i++) { 

                let ehPrimo = true;

                for (let j = 2; j < i; j++) { 

                    if (i % j === 0) { 
                        ehPrimo = false;
                        break;
                    }
                }
                if (ehPrimo) { 
                    primos.push(i);
                }
            }
            document.getElementById("resultadoPrimos").innerHTML = "Os números primos até " + finalPrimo + " são: " + primos.join(", ");

        }
    </script>

</body>
</html>
