<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Ìmpares</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Ímpares:</h1>

            <p>Digite um número para ver os ímpares até ele:</p>

            <label for="final">Número Final:</label>
            
            <input type="number" id="final">

            <button onclick="botao_click()">Descobrir Ímpares</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let final = parseInt(document.getElementById("final").value);

            let numerosImpares = [];

            for (let i = 1; i <= final; i++) { 

                let resto = i % 2;
                // Verifica se o resto da divisão por 2 é diferente de zero, indicando que o número é ímpar
                if (resto != 0) { 
                    numerosImpares.push(i); // Adiciona o número ímpar ao array
                }
            }
            alert("Números ímpares até " + final + ": " + numerosImpares.join(", "));
        }
           
    </script>

</body>
</html>
