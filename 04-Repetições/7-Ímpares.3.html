<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Ímpares 3.0</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <style>


        /* ===== CONFIGURAÇÕES GERAIS ===== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: #d6c8ad;
            background: radial-gradient(ellipse at bottom, #38200f 0%, transparent 45%), linear-gradient(135deg, #080909, #171513 60%, #090909);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* ===== CONTAINER ===== */

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* ===== PAINEL PRINCIPAL ===== */

        .box {
            position: relative;
            background: linear-gradient( 145deg, #1b1a18, #0d0d0c 70% );
            border: 1px solid #6b4b27;
            border-radius: 8px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(180, 95, 25, 0.08), inset 0 0 30px rgba(0, 0, 0, 0.7);
        }

        /* ===== ASSINATURA ===== */

        #assinatura {
            display: block;
            font-size: 22px;
            letter-spacing: 4px;
            color: #c99b54;
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(201, 155, 84, 0.3);
        }

        /* ===== TÍTULO ===== */

        h1 {
            font-size: 30px;
            font-weight: normal;
            color: #e8d7b8;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* ===== DESCRIÇÃO ===== */

        .box > p:not(#resultado) {
            font-size: 16px;
            line-height: 1.6;
            color: #9d9587;
            margin-bottom: 30px;
        }

        /* ===== LABELS ===== */

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #c9a66b;
            font-size: 17px;
        }

        /* ===== CAMPOS ===== */

        input {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            background: #090909;
            border: 1px solid #493923;
            border-radius: 5px;
            color: #e8d7b8;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

            /* Efeito ao selecionar o campo */

            input:focus {
                border-color: #bd792e;
                box-shadow: 0 0 10px rgba(189, 121, 46, 0.2);
            }

        /* ===== BOTÃO ===== */

        button {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: linear-gradient( 180deg, #3a2414, #1b110a );
            border: 1px solid #a66a2c;
            border-radius: 5px;
            color: #e6b36b;
            font-family: Georgia, serif;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

            /* Brilho de brasa ao passar o mouse */

            button:hover {
                background: linear-gradient( 180deg, #653b1b, #29170b );
                border-color: #e69a42;
                color: #ffe0a3;
                box-shadow: 0 0 15px rgba(230, 125, 35, 0.35), inset 0 0 10px rgba(230, 125, 35, 0.1);
            }

        /* ===== RESULTADO ===== */

        #resultado {
            margin-top: 30px;
            padding: 20px;
            min-height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #493923;
            border-radius: 5px;
            color: #d6c8ad;
            font-size: 16px;
            line-height: 1.8;
            text-align: left;
        }

        /* ===== RESPONSIVIDADE ===== */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
                align-items: flex-start;
            }

            .container {
                width: 100%;
                max-width: 100%;
            }

            .box {
                width: 100%;
                padding: 30px 20px;
                border-radius: 6px;
            }

            #assinatura {
                font-size: 18px;
                letter-spacing: 3px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 25px;
                line-height: 1.3;
                margin-bottom: 15px;
            }

            .box > p:not(#resultado) {
                font-size: 15px;
                margin-bottom: 25px;
            }

            label {
                font-size: 16px;
            }

            input {
                width: 100%;
                padding: 13px;
                font-size: 16px;
            }

            button {
                padding: 15px;
                font-size: 16px;
                letter-spacing: 2px;
            }

            #resultado {
                padding: 15px;
                font-size: 15px;
                overflow-wrap: anywhere;
            }
        }

        /* ===== CELULARES PEQUENOS ===== */

        @media (max-width: 380px) {

            .box {
                padding: 25px 15px;
            }

            h1 {
                font-size: 22px;
            }

            #assinatura {
                font-size: 16px;
                letter-spacing: 2px;
            }

            button {
                font-size: 14px;
            }
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="box">

            <span id="assinatura">RobsonT.Dev</span>

            <h1>Descubra os Números Ímpares:</h1>

            <p>Digite dois números para descobrir os ímpares e a soma deles:</p>

            <label for="inicial">Número Inicial:</label>
            <input type="number" id="inicial">

            <label for="final">Número Final:</label>
            <input type="number" id="final">

            <p id="resultado">Resultado:</p>

            <button onclick="botao_click()">ìmpares</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let inicial = parseInt(document.getElementById("inicial").value);

            let final = parseInt(document.getElementById("final").value);

            let soma = 0;

            let numerosImpares = [];

            if (inicial >= final) { 
                alert("O número inicial dever ser menor que o número final.");
                return;
            }

            for (let i = inicial; i <= final; i++) { 

                let resto = i % 2;

                // Se o resto da divisão for diferente de zero, significa que o número é ímpar
                if (resto !== 0) { 
                    soma += i;
                    numerosImpares.push(i);
                }
            }
            document.getElementById("resultado").innerHTML = "Os números ímpares entre " + inicial + 
                " e " + final + " são: " + numerosImpares.join(", ") + " .<br>A soma dos números ímpares: " + soma; 
        }
    </script>

</body>
</html>
