<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Olá, Mundo com For!</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Olá, Mundo com For!</h1>

            <p>Digite quantas vezes você quer que o programa diga "Olá, Mundo!":</p>

            <label for="for">Olá, Mundo com For:</label>
            
            <input type="number" id="for">

            <button onclick="botao_click()">Olá Mundo!</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let quantidadeOla = parseInt(document.getElementById("for").value);
        
            for (let i = 0; i < quantidadeOla; i++) {
                alert("Olá Mundo!");
            }

        }

    </script>

</body>
</html>
