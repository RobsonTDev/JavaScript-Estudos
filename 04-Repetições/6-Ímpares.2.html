<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Ímpares 2.0</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Números Ímpares</h1>

            <p>Digite dois números para saber os ímpares entre eles:</p>

            <label for="inicial">Número Inicial:</label>
            <input type="number" id="inicial">

            <label for="final">Número Final:</label>
            <input type="number" id="final">

            <button onclick="botao_click()">Descobrir Ímpares</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let inicial = parseInt(document.getElementById("inicial").value);

            let final = parseInt(document.getElementById("final").value);

            let soma = 0;

            let numerosImpares = [];

            if (inicial >= final) {
                alert("O número inicial deve ser menor que o número final.");
                return;
            }

            for (let i = inicial; i <= final; i++) { 

                let resto = i % 2; 

                // Se o resto da divisão for diferente de zero, significa que o número é ímpar
                if (resto > 0) { 
                    soma += i;
                    numerosImpares.push(i);
                }
            }
            alert("Os números ímpares entre " + inicial + " e " + final + " são: " + numerosImpares.join(", ") + ".\nA soma dos números ímpares é: " + soma);

        }

    </script>

</body>
</html>
