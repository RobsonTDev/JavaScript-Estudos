<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Boa Noite</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Boa Noite:</h1>

            <p>Informe a hora atual para dar boa noite!</p>

            <label for="horaAtual">Hora Atual:</label>
            
            <input type="number" id="horaAtual">

            <button onclick="botao_click()">Boa noite</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let horaAtual = Number(document.getElementById("horaAtual").value);

            let mensagem = "Boa Noite!";

            if (horaAtual < 12) {
                alert("Bom Dia!");
            }
            else if (horaAtual >= 12 && horaAtual < 18) {
                alert("Boa tarde!");
            }
            else { 
                alert(mensagem);
            }
        }

    </script>

</body>
</html>
