<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Menor Número</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Menor Número</h1>

            <p>Informe três números para encontrar o menor:</p>

            <label for="num1">Primeiro Número:</label>
            <input type="number" id="num1">

            <label for="num2">Segundo Número:</label>
            <input type="number" id="num2">

            <label for="num3">Terceiro Número:</label>
            <input type="number" id="num3">

            <button onclick="botao_click()">Descobrir Menor Número</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            let num3 = Number(document.getElementById("num3").value);

            if (num1 < num2 && num1 < num3) { 
                alert("O número " + num1 + " é o menor.");
            }
            else if (num2 < num1 && num2 < num3) {
                alert("O número " + num2 + " é o menor.");
            }
            else if (num3 < num1 && num3 < num2) {
                alert("O número " + num3 + " é o menor.");
            }
            else {
                alert("Os números são iguais.");
            }
        }

    </script>

</body>
</html>
