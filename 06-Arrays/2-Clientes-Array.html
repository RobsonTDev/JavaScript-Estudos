<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Clientes</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Clientes:</h1>

            <button onclick="botao_click()">Exibir Clientes</button>

        </div>
    </div>

    <script>


        function botao_click() {

           let clientes = ["Roberto", "Adriana", "José", "Lucas", "Felipe", "Eduardo"];

            for (let i = 0; i < clientes.length; i++) { 
                let cliente = clientes[i];

                alert(cliente);
            }
            let todosClientes = clientes.join(", ");

            alert(todosClientes);
        }

    </script>

</body>
</html>
