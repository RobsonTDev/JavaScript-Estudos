<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Maior, menor e Média</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Maior, Menor e Média:</h1>

           

            <label for="quantidadeNum">Digite a quantidade de números:</label>
            
            <input type="number" id="quantidadeNum">

            <label>Digite os números escolhidos:</label>

            <input type="number" id="numerosDigitados" />

            <button onclick="botao_click()">Armazenar</button>

        </div>
    </div>

    <script>

        let numeros = [];

        function botao_click() {

            let quanNumeros = parseInt(document.getElementById("quantidadeNum").value);

            let numerosSelecionados = document.getElementById("numerosDigitados");

            if (numeros.length < quanNumeros) { 

                let numerosS = parseInt(numerosSelecionados.value);

                numeros.push(numerosS);

                numerosSelecionados.value = "";

                numerosSelecionados.focus();
            }

            if (numeros.length === quanNumeros) { 

                let maiorNumero;

                let menorNumero;

                let soma = 0;

                let media;

                for (let i = 0; i < numeros.length; i++) { 

                    let numero = numeros[i];

                    if (maiorNumero === undefined || numero > maiorNumero) { 
                        maiorNumero = numero;
                    }

                    if (menorNumero === undefined || numero < menorNumero) { 
                        menorNumero = numero;
                    }

                    soma += numero;
                }

                media = soma / numeros.length;

                alert("O maior número é " + maiorNumero + ". O menor número é " + menorNumero + ". A média é " + media);

                numeros = [];

                document.getElementById("quantidadeNum").value = "";
            }





        }

    </script>

</body>
</html>
