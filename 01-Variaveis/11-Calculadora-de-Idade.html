<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Calculadora de Idade</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Calculadora de Idade:</h1>

            <p>Digite o ano de nascimento:</p>

            <label for="anoNascimento">Ano de Nascimento:</label>

            <input type="date" id="anoNascimento">

            <label for="idade">Sua Idade:</label>

            <input type="text" id="idade" readonly>

            <button onclick="botao_click()">Calcular Idade:</button> 

        </div>
    </div>

    <script>

        function botao_click() {

            let anoNascimento = new Date(document.getElementById("anoNascimento").value);

            let anoAtual = new Date();

            let idade = anoAtual.getFullYear() - anoNascimento.getFullYear();

            document.getElementById("idade").value = idade;

        }

    </script>

</body>
</html>
