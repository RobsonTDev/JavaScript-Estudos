<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Soma</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Soma</h1>

            <p>Informe dois números para somar:</p>

            <label for="numero1">Primeiro Número:</label>

            <input type="number" id="numero1">

            <label for="numero2">Segundo Número:</label>

            <input type="number" id="numero2">

            

            <button onclick="botao_click()">Calcular</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let number1 = Number(document.getElementById("numero1").value);
            let number2 = Number(document.getElementById("numero2").value);

            let soma = number1 + number2;

            alert("A soma é " + soma + "!");
        }

    </script>

</body>
</html>
