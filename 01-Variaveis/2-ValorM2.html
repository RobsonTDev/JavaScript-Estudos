<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>ValorDoM2</title>
    <meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <div class="container">
        <div class="box">

            <h1>Calcule o valor do terreno:</h1>

            <p>Digite a largura, comprimento e o valor do metro quadrado:</p>

            <label for="comprimento">Comprimento:</label>

            <input type="number" id="comprimento">

            <label for="largura">Largura:</label>

            <input type="number" id="largura">

            <label for="valorM2">Valor do Metro Quadrado:</label>

            <input type="number" id="valorM2">

            <button onclick="botao_click()">Calcular valor</button>

        </div>
    </div>

    <script>

        function botao_click() {

            let comprimento = Number(document.getElementById("comprimento").value);

            let largura = Number(document.getElementById("largura").value);

            let valorM2 = Number(document.getElementById("valorM2").value);

            let area = comprimento * largura;

            let valorTotal = area * valorM2;

            alert("O valor total do terreno é: R$ " + valorTotal.toFixed(2));

        }

    </script>

</body>
</html>
